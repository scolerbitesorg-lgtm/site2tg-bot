name: site2tg-bot
# Run title shows the command when the Vercel webhook dispatched one.
run-name: ${{ inputs.command && format('cmd {0}', inputs.command) || 'site2tg-bot' }}

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled jobs during busy periods.
    # Monitor Actions minutes: usage depends on how long each scan takes.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Bot command, e.g. /status (the Vercel webhook fills this). Empty = normal run."
        required: false
        default: ""
        type: string
      ack_message_id:
        description: "Telegram message id of the webhook's ⏳ message (edited into the result). Leave empty."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: site2tg-bot
  cancel-in-progress: false
  # keep every waiting run (default would cancel a waiting command when a
  # newer one arrives while a sync is running)
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          # latest tip of the branch, not the commit the run was queued on:
          # runs wait in line (queue: max), and each must see the state.json
          # the previous run pushed (else old commands get answered twice)
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_ID_VIDEO: ${{ secrets.CHANNEL_ID_VIDEO }}
          CHANNEL_ID_FILES: ${{ secrets.CHANNEL_ID_FILES }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          SYNC_EVERY_MIN: ${{ vars.SYNC_EVERY_MIN }}
          MAX_YOUTUBE_LINKS_PER_RUN: ${{ vars.MAX_YOUTUBE_LINKS_PER_RUN }}
          MAX_FILES_PER_RUN: ${{ vars.MAX_FILES_PER_RUN }}
          PARALLEL_DOWNLOADS: ${{ vars.PARALLEL_DOWNLOADS }}
          # optional override: 1 = webhook mode, 0 = polling; empty = ask Telegram
          WEBHOOK_MODE: ${{ vars.WEBHOOK_MODE }}
          # passed through env (never pasted into the script) so text can't run as shell
          INJECTED_COMMAND: ${{ inputs.command }}
          ACK_MESSAGE_ID: ${{ inputs.ack_message_id }}
        run: python -m bot.main

      - name: Save state.json
        if: always()
        run: |
          git config user.name "site2tg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              git rebase --abort 2>/dev/null || true
              echo "push failed, retrying ($i)"; sleep 5
            done
          fi
