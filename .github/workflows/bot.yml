name: site2tg-bot
# Run title shows the command when the Vercel webhook dispatched one.
run-name: ${{ inputs.command && format('cmd {0}', inputs.command) || 'site2tg-bot' }}

on:
  schedule:
    # every hour (minute 17) for the scheduled sync. Commands don't wait for
    # this when the Vercel webhook is on: it starts a run right away.
    # Hourly keeps a PRIVATE repo well inside GitHub's free 2000 min/month.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Bot command, e.g. /status (the Vercel webhook fills this). Empty = normal run."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: site2tg-bot
  cancel-in-progress: false
  # keep every waiting run (default would cancel a waiting command when a
  # newer one arrives while a sync is running)
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          SYNC_EVERY_MIN: ${{ vars.SYNC_EVERY_MIN }}
          MAX_FILES_PER_RUN: ${{ vars.MAX_FILES_PER_RUN }}
          # optional override: 1 = webhook mode, 0 = polling; empty = ask Telegram
          WEBHOOK_MODE: ${{ vars.WEBHOOK_MODE }}
          # passed through env (never pasted into the script) so text can't run as shell
          INJECTED_COMMAND: ${{ inputs.command }}
        run: python -m bot.main

      - name: Save state.json
        if: always()
        run: |
          git config user.name "site2tg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: update [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
