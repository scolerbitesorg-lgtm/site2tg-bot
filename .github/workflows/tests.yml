name: tests

on:
  push:
    branches: ["main", "chatgpt-maintenance-20261028", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax and imports
        run: python -m compileall -q bot tests
      - name: Run offline mocked tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check webhook JavaScript syntax
        run: node --check lib/webhook.js
      - name: Webhook tests
        run: node --test tests/webhook.test.js
